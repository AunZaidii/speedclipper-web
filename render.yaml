# Render Blueprint: one free web service = Express API + built React app.
services:
  - type: web
    name: speedclipper
    runtime: node
    plan: free
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: WORKER_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
